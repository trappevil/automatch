<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoMatch</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="app-shell">

        <!-- HOME -->
        <section id="home-view" class="view">
            <div class="header-block">
                <p class="eyebrow">Weighted car matching</p>
                <h1>AutoMatch</h1>
                <p class="intro">Choose a buyer profile and rank cars by what matters most.</p>
            </div>

            <form id="profile-form">

                <label for="profile-select">Choose a Profile</label>

                <select id="profile-select">
                    <option value="firstTimeBuyer">First-Time Buyer</option>
                    <option value="enthusiast">Enthusiast</option>
                    <option value="dailyCommuter">Daily Commuter</option>
                    <option value="custom">Custom</option>
                </select>

                <!-- CUSTOM SLIDERS -->
                <div id="custom-profile" class="hidden">

                    <div class="slider-group">
                        <div class="slider-label">
                            Reliability
                            <button type="button" class="lock-btn" data-slider="reliability">🔓</button>
                            <span id="reliability-value">35</span>
                        </div>

                        <input type="range"
                               id="reliability-slider"
                               min="0"
                               max="100"
                               step="5"
                               value="35">
                    </div>

                    <div class="slider-group">
                        <div class="slider-label">
                            Cost of Ownership
                            <button type="button" class="lock-btn" data-slider="cost">🔓</button>
                            <span id="cost-value">25</span>
                        </div>

                        <input type="range"
                               id="cost-slider"
                               min="0"
                               max="100"
                               step="5"
                               value="25">
                    </div>

                    <div class="slider-group">
                        <div class="slider-label">
                            Insurance Affordability
                            <button type="button" class="lock-btn" data-slider="insurance">🔓</button>
                            <span id="insurance-value">20</span>
                        </div>

                        <input type="range"
                               id="insurance-slider"
                               min="0"
                               max="100"
                               step="5"
                               value="20">
                    </div>

                    <div class="slider-group">
                        <div class="slider-label">
                            Fuel Efficiency
                            <button type="button" class="lock-btn" data-slider="fuel">🔓</button>
                            <span id="fuel-value">15</span>
                        </div>

                        <input type="range"
                               id="fuel-slider"
                               min="0"
                               max="100"
                               step="5"
                               value="15">
                    </div>

                    <div class="slider-group">
                        <div class="slider-label">
                            Performance
                            <button type="button" class="lock-btn" data-slider="performance">🔓</button>
                            <span id="performance-value">5</span>
                        </div>

                        <input type="range"
                               id="performance-slider"
                               min="0"
                               max="100"
                               step="5"
                               value="5">
                    </div>

                </div>

                <button type="submit">Generate Rankings</button>
            </form>
        </section>

        <!-- RESULTS -->
        <section id="results-view" class="view hidden">

            <div class="page-topbar">
                <button id="back-home" class="secondary-button" type="button">
                    Change Profile
                </button>

                <div>
                    <p class="eyebrow">Results</p>
                    <h2 id="results-title">Car Rankings</h2>
                </div>
            </div>

            <div id="profile-summary" class="summary-strip"></div>

            <div class="controls">

                <input id="min-price" type="number" placeholder="Min Price">
                <input id="max-price" type="number" placeholder="Max Price">

                <input id="min-year" type="number" placeholder="Min Year">
                <input id="max-year" type="number" placeholder="Max Year">

                <select id="transmission-filter">
                    <option value="all">Any Transmission</option>
                    <option value="Automatic">Automatic</option>
                    <option value="Manual">Manual</option>
                </select>

                <select id="drivetrain-filter">
                    <option value="all">Any Drivetrain</option>
                    <option value="FWD">FWD</option>
                    <option value="RWD">RWD</option>
                    <option value="AWD">AWD</option>
                    <option value="4WD">4WD</option>
                </select>

                <select id="fuel-filter">
                    <option value="all">Any Fuel Type</option>
                    <option value="Gasoline">Gasoline</option>
                    <option value="Hybrid">Hybrid</option>
                    <option value="Electric">Electric</option>
                    <option value="Diesel">Diesel</option>
                </select>

                <select id="make-filter">
                    <option value="all">Any Make</option>
                </select>

                <input id="min-horsepower" type="number" placeholder="Min HP">
                <input id="min-torque" type="number" placeholder="Min Torque">

                <input id="min-seats" type="number" placeholder="Minimum Seats">

                <select id="filter-body">
                    <option value="all">All Body Styles</option>
                    <option value="Sedan">Sedan</option>
                    <option value="SUV">SUV</option>
                    <option value="Coupe">Coupe</option>
                    <option value="Hatchback">Hatchback</option>
                </select>

                <input id="search-input" type="text" placeholder="Search cars..." />

                <select id="sort-select">
                    <option value="bestMatch">Best Match</option>
                    <option value="performance">Performance</option>
                    <option value="cost">Lowest Cost</option>
                </select>

            </div>

            <div id="rankings-list"></div>
        </section>

        <!-- DETAILS -->
        <section id="details-view" class="view hidden">

            <div class="page-topbar">
                <button id="back-results" class="secondary-button" type="button">
                    Back
                </button>

                <div>
                    <p class="eyebrow">Car details</p>
                    <h2 id="details-title"></h2>
                </div>
            </div>

            <div class="details-grid">

                <section class="details-panel">
                    <div class="score-callout">
                        <span>Final Score</span>
                        <strong id="details-final-score"></strong>
                    </div>

                    <p id="details-rank-note"></p>
                    <p id="details-why"></p>
                </section>

                <section class="details-panel">
                    <h3>Category Scores</h3>
                    <div id="category-scores"></div>
                </section>

            </div>
        </section>

        <!-- ERROR -->
        <section id="error-view" class="view hidden">
            <h1>AutoMatch</h1>
            <p id="error-message"></p>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
