<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoMatch</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="app-shell">

        <!-- HOME -->
        <section id="home-view" class="view">
            <div class="header-block">
                <p class="eyebrow">Weighted car matching</p>
                <h1>AutoMatch</h1>
                <p class="intro">Choose a buyer profile and rank cars by what matters most.</p>
            </div>

            <form id="profile-form">

                <label for="profile-select">Choose a Profile</label>

                <select id="profile-select">
                    <option value="firstTimeBuyer">First-Time Buyer</option>
                    <option value="enthusiast">Enthusiast</option>
                    <option value="dailyCommuter">Daily Commuter</option>
                    <option value="custom">Custom</option>
                </select>

                <!-- CUSTOM SLIDERS -->
                <div id="custom-profile" class="hidden">

                    <label>Reliability <span id="reliability-value">35</span></label>
                    <input type="range" id="reliability-slider" min="1" max="100" value="35">

                    <label>Cost of Ownership <span id="cost-value">25</span></label>
                    <input type="range" id="cost-slider" min="1" max="100" value="25">

                    <label>Insurance Affordability <span id="insurance-value">20</span></label>
                    <input type="range" id="insurance-slider" min="1" max="100" value="20">

                    <label>Fuel Efficiency <span id="fuel-value">15</span></label>
                    <input type="range" id="fuel-slider" min="1" max="100" value="15">

                    <label>Performance <span id="performance-value">5</span></label>
                    <input type="range" id="performance-slider" min="1" max="100" value="5">

                </div>

                <button type="submit">Generate Rankings</button>
            </form>
        </section>

        <!-- RESULTS -->
        <section id="results-view" class="view hidden">

            <div class="page-topbar">
                <button id="back-home" class="secondary-button" type="button">Change Profile</button>
                <div>
                    <p class="eyebrow">Results</p>
                    <h2 id="results-title">Car Rankings</h2>
                </div>
            </div>

            <div id="profile-summary" class="summary-strip"></div>

            <div class="controls">
                <select id="filter-body">
                    <option value="all">All Body Styles</option>
                    <option value="Sedan">Sedan</option>
                    <option value="SUV">SUV</option>
                    <option value="Coupe">Coupe</option>
                    <option value="Hatchback">Hatchback</option>
                </select>

                <input id="search-input" type="text" placeholder="Search cars..." />

                <select id="sort-select">
                    <option value="bestMatch">Best Match</option>
                    <option value="performance">Performance</option>
                    <option value="cost">Lowest Cost</option>
                </select>
            </div>

            <div id="rankings-list"></div>
        </section>

        <!-- DETAILS -->
        <section id="details-view" class="view hidden">

            <div class="page-topbar">
                <button id="back-results" class="secondary-button" type="button">Back</button>
                <div>
                    <p class="eyebrow">Car details</p>
                    <h2 id="details-title"></h2>
                </div>
            </div>

            <div class="details-grid">

                <section class="details-panel">
                    <div class="score-callout">
                        <span>Final Score</span>
                        <strong id="details-final-score"></strong>
                    </div>

                    <p id="details-rank-note"></p>
                    <p id="details-why"></p>
                </section>

                <section class="details-panel">
                    <h3>Category Scores</h3>
                    <div id="category-scores"></div>
                </section>

            </div>
        </section>

        <!-- ERROR -->
        <section id="error-view" class="view hidden">
            <h1>AutoMatch</h1>
            <p id="error-message"></p>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
